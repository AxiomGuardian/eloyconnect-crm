<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eloy Connect — Upload Evidence</title>
<style>
  :root{--bg:#0b1120;--card:#141d31;--line:rgba(255,255,255,.10);--txt:#eef2f8;--sub:#93a0b4;--cyan:#3fe0e8;--violet:#818cf8;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#16233f 0%,var(--bg) 60%);color:var(--txt);min-height:100vh;padding:24px 18px calc(24px + env(safe-area-inset-bottom));}
  .wrap{max-width:520px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);}
  .brand b{font-size:15px;letter-spacing:.3px;}
  h1{font-size:22px;margin:6px 0 4px;}
  p.sub{color:var(--sub);font-size:14px;margin:0 0 20px;line-height:1.5;}
  .drop{border:1.5px dashed rgba(63,224,232,.4);background:linear-gradient(160deg,rgba(63,224,232,.06),rgba(129,140,248,.04));border-radius:18px;padding:30px 18px;text-align:center;}
  .cam{width:58px;height:58px;border-radius:50%;background:rgba(63,224,232,.14);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
  .cam svg{width:28px;height:28px;stroke:var(--cyan);}
  .btn{display:block;width:100%;padding:15px;border:none;border-radius:14px;font-size:16px;font-weight:700;color:#04121a;background:linear-gradient(135deg,#7ff0f5,#3fd0d8);cursor:pointer;margin-top:14px;}
  .btn.sec{background:rgba(255,255,255,.06);color:var(--txt);border:1px solid var(--line);font-weight:600;}
  input[type=file]{display:none;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;}
  .thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0f1728;}
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .thumb .sp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .ring{width:22px;height:22px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;}
  .thumb .ok{position:absolute;bottom:5px;right:5px;width:20px;height:20px;border-radius:50%;background:#22c55e;display:flex;align-items:center;justify-content:center;}
  .thumb .ok svg{width:12px;height:12px;stroke:#fff;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .done{margin-top:18px;padding:14px;border-radius:12px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#86efac;font-size:14px;text-align:center;display:none;}
  .count{font-size:13px;color:var(--sub);margin-top:14px;text-align:center;}
  .err{margin-top:18px;padding:14px;border-radius:12px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5;font-size:14px;text-align:center;}
</style></head><body><div class="wrap">
  <div class="brand"><span class="dot"></span><b>Eloy Connect</b></div>
  <h1>Upload evidence photos</h1>
  <p class="sub">Snap or choose photos of the violation. They appear live on the officer's screen. You can add up to 20.</p>
  <div id="app"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="done" id="done">Photos received. You can close this page, the officer has them.</div>
</div>
<script>
  var FN='https://ocmqgjltgmybqboynsce.supabase.co/functions/v1/notice-upload';
  var TOKEN=new URLSearchParams(location.search).get('s')||'';
  var count=0;
  var app=document.getElementById('app'), grid=document.getElementById('grid'), countEl=document.getElementById('count'), doneEl=document.getElementById('done');
  if(!TOKEN){
    app.innerHTML='<div class="err">This link is missing its session code. Ask the officer to show the QR again.</div>';
  } else {
    app.innerHTML=''
      +'<div class="drop">'
      +'<div class="cam"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.4-2.2h5.2L16 7"/></svg></div>'
      +'<div style="font-size:15px;font-weight:600;">Tap to capture or select</div>'
      +'<button class="btn" id="bcam">Take photo</button>'
      +'<button class="btn sec" id="blib">Choose from library</button>'
      +'<input id="cam" type="file" accept="image/*" capture="environment" multiple>'
      +'<input id="lib" type="file" accept="image/*" multiple>'
      +'</div>';
    document.getElementById('bcam').addEventListener('click',function(){document.getElementById('cam').click();});
    document.getElementById('blib').addEventListener('click',function(){document.getElementById('lib').click();});
    document.getElementById('cam').addEventListener('change',function(e){handle(e.target.files);});
    document.getElementById('lib').addEventListener('change',function(e){handle(e.target.files);});
  }
  function upd(){ countEl.textContent = count? count+' of 20 uploaded':''; }
  async function handle(files){
    var list=[].slice.call(files).filter(function(f){return f.type.indexOf('image/')===0;});
    for(var i=0;i<list.length;i++){
      var f=list[i];
      if(count>=20){ alert('Up to 20 photos'); break; }
      count++;
      var cell=document.createElement('div'); cell.className='thumb';
      cell.innerHTML='<div class="sp"><div class="ring"></div></div>';
      grid.appendChild(cell); upd();
      try{
        var dataUrl=await readFile(f);
        var resp=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN,image:dataUrl,filename:f.name})});
        if(!resp.ok) throw new Error('upload failed');
        var j=await resp.json();
        cell.innerHTML='<img src="'+j.url+'"><div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg></div>';
        doneEl.style.display='block';
      }catch(e){ cell.innerHTML='<div class="sp" style="color:#f87171;font-size:11px;">Failed</div>'; count--; upd(); }
    }
  }
  function readFile(f){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=rej; r.readAsDataURL(f); }); }
</script></body></html>
